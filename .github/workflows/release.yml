name: Release

on:
  push:
    branches:
      - main
    paths:
      - "CREWBOARD.md"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from CREWBOARD.md
        id: version
        run: |
          V=$(grep -m1 '버전:' CREWBOARD.md | sed -E 's/.*v([0-9]+\.[0-9]+).*/\1/')
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Parsed version: ${V}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          # CREWBOARD 변경 요약. 같은 blockquote 안에서 다음 버전 항목 전까지 수집한다.
          SUMMARY=$(awk -v v="${V}" '
            $0 ~ "^> v" v " 변경:" {
              sub("^> v" v " 변경: ", "")
              print
              capture=1
              next
            }
            capture && $0 ~ "^> v[0-9]+\\.[0-9]+ 변경:" { exit }
            capture && $0 ~ "^> " {
              sub("^> ?", "")
              print
              next
            }
            capture { exit }
          ' CREWBOARD.md)

          # GitHub 자동 생성 노트 (What's Changed + Full Changelog 링크)
          GENERATED=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${TAG}" \
            --jq '.body')

          # 요약 + 자동 노트 결합
          printf "## Summary\n%s\n\n---\n\n%s\n" "$SUMMARY" "$GENERATED" > /tmp/release-notes.txt
          echo "Release notes:"; cat /tmp/release-notes.txt

      - name: Create release and upload asset
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            CREWBOARD.md \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.txt
          echo "Released ${{ steps.version.outputs.tag }} with CREWBOARD.md asset."
